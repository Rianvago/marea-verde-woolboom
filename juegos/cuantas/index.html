<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="stage">
  <canvas id="cv" width="1600" height="900" aria-label="Juego ¿Cuántas ovejas?"></canvas>
  <a id="wb" href="#contacto">Conversemos sobre WoolBoom</a>
</div>
<script>
(() => {
'use strict';
/* ================== Base ================== */
const W = 1600, H = 900;
const COL = { crema:'#FBF4E6', coral:'#F2706B', menta:'#3FC2A6', oro:'#FFD98A', petroleo:'#00303F', tinta:'#141414' };
const FT = "'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif";
const BG = "'Bagel Fat One', 'Figtree', system-ui, sans-serif";
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wb = document.getElementById('wb');

function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const s = Math.min(iw / W, ih / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(1, Math.round(W * s * dpr));
  cv.height = Math.max(1, Math.round(H * s * dpr));
  stage.style.transform = `translate(${(iw - W * s) / 2}px,${(ih - H * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

/* ================== Imágenes ================== */
const IMG_NAMES = ['fondo_mesa', 'portada_cuantas', 'oveja_pensando', 'oveja_celebrando',
  'oveja_lanuda_feliz', 'oveja_lanuda_comiendo', 'oveja_lanuda_dormida', 'oveja_lanuda_sorprendida',
  'oveja_esquilada_1', 'oveja_esquilada_2', 'oveja_esquilada_3', 'oveja_esquilada_4',
  'saco_lana', 'barrera_tramo', 'estrella', 'corfo',
  'mujer_lavando', 'mujer_colgando', 'mujeres_saludando'];
const IMG = {};
let loadedCount = 0, fontsReady = false;
IMG_NAMES.forEach(n => {
  const im = new Image();
  im.onload = im.onerror = () => { loadedCount++; };
  im.src = '../assets/' + n + '.webp';
  IMG[n] = im;
});
const okImg = im => im && im.complete && im.naturalWidth > 0;
(function loadFonts() {
  const done = () => { fontsReady = true; };
  try {
    Promise.race([
      Promise.all([document.fonts.load('40px "Bagel Fat One"'), document.fonts.load('800 30px Figtree'), document.fonts.load('700 30px Figtree')]),
      new Promise(r => setTimeout(r, 2500))
    ]).then(done, done);
  } catch (e) { done(); }
})();
const LANUDAS = ['oveja_lanuda_feliz', 'oveja_lanuda_comiendo', 'oveja_lanuda_sorprendida', 'oveja_lanuda_dormida'];
const ESQUILADAS = ['oveja_esquilada_1', 'oveja_esquilada_2', 'oveja_esquilada_3', 'oveja_esquilada_4'];

/* ================== Sonido (WebAudio sintetizado) ================== */
let AC = null, master = null, noiseBuf = null, muted = false;
function ensureAudio() {
  try {
    if (!AC) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      AC = new A();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.9; }
function tone(f, d, type = 'square', v = .08, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + d + 0.05);
}
function noise(d, v, freq, q = 1, type = 'bandpass', delay = 0, attack = 0.005, f2 = null) {
  if (!AC || muted || !noiseBuf) return;
  const t0 = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + d + 0.05);
}
const sfx = {
  click() { tone(520, .07, 'triangle', .08); },
  snip() { noise(.035, .22, 5200, 4, 'bandpass'); noise(.04, .2, 6400, 4, 'bandpass', .06); tone(1250, .04, 'square', .025, null, .06); },
  unsnip() { tone(420, .1, 'triangle', .07, 300); },
  place(i) { const n = [0, 2, 4, 7, 9, 12, 9, 7]; tone(392 * Math.pow(2, n[i % 8] / 12), .1, 'triangle', .1); noise(.03, .05, 2000, 1); },
  wind() { noise(1.4, .16, 500, .8, 'bandpass', 0, .4, 1400); },
  slurp() { tone(260, .55, 'sine', .14, 70); tone(180, .4, 'triangle', .06, 90, .15); },
  fail() { tone(392, .22, 'sawtooth', .045, 330); tone(311, .4, 'sawtooth', .045, 220, .22); },
  close() { tone(660, .12, 'square', .05); tone(990, .2, 'square', .05, null, .1); },
  star(i) { tone(784 * Math.pow(2, (i * 4) / 12), .16, 'square', .05); tone(1568 * Math.pow(2, (i * 4) / 12), .1, 'triangle', .03, null, .03); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, 'square', .05, null, i * .09)); },
  swoosh() { noise(.3, .08, 900, 1, 'bandpass', 0, .05, 2500); }
};

/* ================== Entrada (pointer) ================== */
let buttons = [];
let pressed = null, holdT = 0, holdAcc = 0;
const ptr = { x: 0, y: 0, down: false };
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inside = (b, p) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function hit(p) {
  for (let i = buttons.length - 1; i >= 0; i--) if (inside(buttons[i], p)) return buttons[i];
  return null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  const p = toLocal(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const b = hit(p);
  if (b && !b.disabled) {
    pressed = { id: b.id, repeat: b.repeat };
    holdT = 0; holdAcc = 0;
    if (b.repeat || b.instant) b.onClick && b.onClick();
  }
});
cv.addEventListener('pointermove', e => { const p = toLocal(e); ptr.x = p.x; ptr.y = p.y; });
cv.addEventListener('pointerup', e => {
  const p = toLocal(e); ptr.x = p.x; ptr.y = p.y; ptr.down = false;
  const b = hit(p);
  if (pressed && b && b.id === pressed.id && !b.repeat && !b.instant && !b.disabled && b.onClick) b.onClick();
  pressed = null;
});
cv.addEventListener('pointercancel', () => { ptr.down = false; pressed = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ================== Dibujo: utilidades ================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function panel(x, y, w, h, fill, r = 18, sh = 6, lw = 4) {
  if (sh) { ctx.fillStyle = COL.tinta; rr(x + sh, y + sh, w, h, r); ctx.fill(); }
  ctx.fillStyle = fill; rr(x, y, w, h, r); ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = COL.tinta; ctx.stroke();
}
function font(size, o = {}) { return o.bagel ? `${size}px ${BG}` : `${o.w || 800} ${size}px ${FT}`; }
function text(s, x, y, size, o = {}) {
  ctx.font = font(size, o);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.shadow) { ctx.fillStyle = o.shadowColor || COL.tinta; ctx.fillText(s, x + o.shadow, y + o.shadow); }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = o.strokeColor || COL.tinta; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || COL.tinta;
  ctx.fillText(s, x, y);
}
function wrapLines(s, maxW, size, o = {}) {
  ctx.font = font(size, o);
  const out = [];
  s.split('\n').forEach(par => {
    const words = par.split(' '); let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
    });
    out.push(line);
  });
  return out;
}
function drawFit(img, x, y, w, h, ax = .5, ay = 1) {
  if (!okImg(img)) return;
  const s = Math.min(w / img.naturalWidth, h / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  ctx.drawImage(img, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
}
function drawBg(name) {
  const im = IMG[name];
  if (okImg(im)) ctx.drawImage(im, 0, 0, W, W * im.naturalHeight / im.naturalWidth);
  else { ctx.fillStyle = COL.coral; ctx.fillRect(0, 0, W, H); }
}
function button(id, x, y, w, h, label, o = {}) {
  const b = { id, x, y, w, h, onClick: o.onClick, repeat: o.repeat, instant: o.instant, disabled: !!o.disabled };
  buttons.push(b);
  if (o.invisible) return b;
  const down = pressed && pressed.id === id && ptr.down && inside(b, ptr) && !b.disabled;
  const off = down ? 4 : 0, sh = 5;
  ctx.save();
  if (b.disabled) ctx.globalAlpha = .45;
  ctx.fillStyle = COL.tinta; rr(x + sh, y + sh, w, h, 14); ctx.fill();
  ctx.fillStyle = o.fill || COL.oro; rr(x + off, y + off, w, h, 14); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = COL.tinta; ctx.stroke();
  if (o.active) {
    ctx.lineWidth = 3; ctx.strokeStyle = COL.tinta; ctx.setLineDash([6, 5]);
    rr(x + off + 7, y + off + 7, w - 14, h - 14, 9); ctx.stroke(); ctx.setLineDash([]);
  }
  if (o.draw) o.draw(x + off, y + off, w, h);
  else text(label, x + w / 2 + off, y + h / 2 + off + (o.bagel ? 3 : 1), o.size || 26, { bagel: o.bagel, color: o.color || COL.tinta });
  ctx.restore();
  return b;
}
function drawStar(x, y, size, filled, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (filled) drawFit(IMG.estrella, -size / 2, -size / 2, size, size, .5, .5);
  else { ctx.globalAlpha = .2; drawFit(IMG.estrella, -size / 2, -size / 2, size, size, .5, .5); }
  ctx.restore();
}
let dotPattern = null;
function getDots() {
  if (dotPattern) return dotPattern;
  const c = document.createElement('canvas'); c.width = c.height = 11;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.beginPath(); g.arc(5.5, 5.5, 2.1, 0, Math.PI * 2); g.fill();
  dotPattern = ctx.createPattern(c, 'repeat');
  return dotPattern;
}

/* ================== Geometría de la cuadrícula ================== */
const GX = 368, GY = 122, CS = 72, COLS = 12, ROWS = 7;
const LAND_ROW = 6; // nivel del muelle: la fila 6 es tierra
const key = (c, r) => c + ',' + r;
const gx = x => GX + x * CS, gy = y => GY + y * CS;

function loopsOf(cells, isLand) {
  const set = new Set(cells.map(([c, r]) => key(c, r)));
  const edges = [];
  for (const [c, r] of cells) {
    // sentido horario en pantalla: arriba, derecha, abajo, izquierda
    const sides = [[0, -1, c, r, c + 1, r], [1, 0, c + 1, r, c + 1, r + 1], [0, 1, c + 1, r + 1, c, r + 1], [-1, 0, c, r + 1, c, r]];
    for (const [dc, dr, x1, y1, x2, y2] of sides) {
      const nc = c + dc, nr = r + dr;
      if (set.has(key(nc, nr))) continue;
      const dx = x2 - x1, dy = y2 - y1;
      edges.push({ x1, y1, x2, y2, nx: -dy, ny: dx, coast: !!(isLand && isLand(nc, nr)), used: false });
    }
  }
  const byStart = new Map();
  edges.forEach(e => { const k = key(e.x1, e.y1); if (!byStart.has(k)) byStart.set(k, []); byStart.get(k).push(e); });
  const out = [];
  for (const e0 of edges) {
    if (e0.used) continue;
    const loop = []; let e = e0;
    while (e && !e.used) {
      e.used = true; loop.push(e);
      const list = byStart.get(key(e.x2, e.y2));
      e = list ? list.find(q => !q.used) : null;
    }
    out.push(loop);
  }
  return out;
}
function barrierFromLoop(loop) {
  const n = loop.length;
  if (!loop.some(e => e.coast)) return loop.slice();
  let start = 0;
  for (let i = 0; i < n; i++) if (!loop[i].coast && loop[(i - 1 + n) % n].coast) { start = i; break; }
  const res = [];
  for (let k = 0; k < n; k++) { const e = loop[(start + k) % n]; if (!e.coast) res.push(e); }
  return res;
}
function cornersOf(loop, inset) {
  const n = loop.length, pts = [];
  for (let i = 0; i < n; i++) {
    const a = loop[(i - 1 + n) % n], b = loop[i];
    if (a.nx === b.nx && a.ny === b.ny) continue;
    pts.push({ x: gx(b.x1) + (a.nx + b.nx) * inset, y: gy(b.y1) + (a.ny + b.ny) * inset });
  }
  return pts;
}
function grow(cells, [dx, dy]) {
  const m = new Map();
  cells.forEach(([c, r]) => { m.set(key(c, r), [c, r]); m.set(key(c + dx, r + dy), [c + dx, r + dy]); });
  return [...m.values()];
}
function centroid(pts) {
  let x = 0, y = 0; pts.forEach(p => { x += p.x; y += p.y; });
  return { x: x / pts.length, y: y / pts.length };
}

/* ================== Niveles ================== */
const LV = [
  { name: 'Mancha chica', sub: 'Mancha chica y redonda',
    blobs: [[[5, 2], [6, 2], [5, 3], [6, 3]]],
    rule: 'Cuenta el borde de la mancha',
    intro: '¿Cuántas ovejas hay que esquilar para rodear esta mancha? Cada lado de cuadrito del borde necesita una barrera de 3 m.',
    hint: 'Cada lado de cuadrito del borde es una barrera de 3 m, y cada oveja da aprox. una barrera. Los números te ayudan a contar.' },
  { name: 'Mancha alargada', sub: 'Mancha alargada',
    blobs: [[[4, 3], [5, 3], [6, 3], [7, 3]]],
    rule: 'Estirada pide más barrera',
    intro: 'Esta mancha tiene los mismos cuadritos que la anterior, pero es alargada. ¿Cuántas ovejas ahora?',
    hint: 'Recorre el borde punteado y cuenta lado por lado. Una forma estirada pide más barrera.' },
  { name: 'Dos manchas', sub: 'Dos manchas cercanas',
    blobs: [[[4, 2], [5, 2], [4, 3], [5, 3]], [[7, 2], [7, 3]]],
    modes: [
      { id: 'dos', label: 'Dos chicos', rings: null },
      { id: 'uno', label: 'Uno grande', rings: [[[4, 2], [5, 2], [6, 2], [7, 2], [4, 3], [5, 3], [6, 3], [7, 3]]] }
    ],
    optimal: 'uno',
    rule: '¿1 anillo grande o 2 chicos?',
    intro: 'Dos manchas cercanas. ¿Conviene un anillo grande o dos chicos? Elige con los botones y cuenta.',
    hint: 'Cuenta los lados de cada contorno punteado. Prueba los dos botones: ¿cuál necesita menos barreras?' },
  { name: 'Con viento', sub: 'Con viento',
    blobs: [[[4, 2], [5, 2], [5, 3], [6, 3], [6, 4]]],
    wind: [1, 0],
    rule: 'El viento la agranda 1 cuadrito',
    intro: 'Viento: antes de que llegue la barrera, la mancha crecerá 1 cuadrito hacia la flecha.',
    hint: 'El fantasma punteado muestra cómo quedará la mancha con el viento. Cuenta el borde del fantasma.' },
  { name: 'Junto al muelle', sub: 'Junto al muelle',
    blobs: [[[5, 4], [6, 4], [5, 5], [6, 5], [7, 5]]],
    coast: true,
    rule: 'El muelle sirve de borde',
    intro: 'Junto al muelle. El muelle sirve de borde: por ese lado no hace falta barrera.',
    hint: 'Los lados pegados al muelle (en verde) no necesitan barrera. Cuenta solo el borde punteado.' }
];
const MAXS = 24;
const INSET = 9;

function prepLevel(L) {
  const land = L.coast ? (c, r) => r >= LAND_ROW : null;
  const geo = {};
  geo.blobs = L.blobs.map(cells => { const loop = loopsOf(cells, land)[0]; return { cells, loop, pts: cornersOf(loop, INSET) }; });
  if (L.wind) {
    const gc = grow(L.blobs[0], L.wind); const loop = loopsOf(gc, land)[0];
    geo.grown = { cells: gc, loop, pts: cornersOf(loop, INSET) };
  }
  const pathsFor = rings => rings.map(cells => barrierFromLoop(loopsOf(cells, land)[0]));
  geo.paths = {};
  if (L.modes) L.modes.forEach(m => { geo.paths[m.id] = pathsFor(m.rings || L.blobs); });
  else geo.paths.main = pathsFor(L.wind ? [geo.grown.cells] : L.blobs);
  geo.need = {};
  Object.keys(geo.paths).forEach(k => { geo.need[k] = geo.paths[k].reduce((a, p) => a + p.length, 0); });
  // contorno en el que el jugador ve la regla (sin viento) para la pista del nivel 4
  if (L.wind) geo.basePaths = pathsFor(L.blobs);
  return geo;
}
LV.forEach(L => { L.geo = prepLevel(L); });
function modeKey(L, mode) { return L.modes ? mode : 'main'; }
function optimalKey(L) { return L.modes ? L.optimal : 'main'; }

/* ================== Estado ================== */
let screen = 'loading';
let SPEED = 1, T = 0;
const G = {
  level: 0, count: 0, mode: 'dos', hint: false, phase: 'plan', sim: null, grown: false,
  stars: [0, 0, 0, 0, 0], msg: '', mood: 'pensando', moodT: 0, shake: 0,
  sheepT: new Array(MAXS).fill(9), pop: 0, particles: [], waves: [], winds: []
};
try {
  const s = JSON.parse(localStorage.getItem('woolboom_cuantas_estrellas') || 'null');
  if (Array.isArray(s) && s.length === 5) G.stars = s.map(v => clamp(v | 0, 0, 3));
} catch (e) {}
function saveStars() { try { localStorage.setItem('woolboom_cuantas_estrellas', JSON.stringify(G.stars)); } catch (e) {} }
const unlocked = i => i === 0 || G.stars[i - 1] > 0;
const allDone = () => G.stars.every(s => s > 0);

function rngSeed(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function startLevel(i) {
  G.level = clamp(i, 0, LV.length - 1);
  G.count = 0; G.mode = 'dos'; G.hint = false; G.sheepT.fill(9);
  G.particles = [];
  const r = rngSeed(i + 3);
  G.waves = []; for (let k = 0; k < 16; k++) G.waves.push({ x: r() * COLS * CS, y: r() * ROWS * CS, s: .7 + r() * .5, p: r() * 6 });
  G.winds = []; for (let k = 0; k < 14; k++) G.winds.push({ x: r() * COLS * CS, y: r() * ROWS * CS, l: 50 + r() * 80, v: 140 + r() * 120 });
  resetPlan();
  screen = 'play';

function drawFlyers(t) {
  const s = G.sim; if (!s || s.phase === 'wind') return;
  const sx = 1272 + 52, sy = PANEL_ROWS[3];
  for (let i = 0; i < s.placedN; i++) {
    const lt = s.clock - i * s.interval;
    if (lt < 0 || lt >= FLY) continue;
    const k = easeInOut(lt / FLY);
    const [a, b, c, d] = edgePx(s.edges[i]);
    const tx = (a + c) / 2, ty = (b + d) / 2;
    const x = lerp(sx, tx, k), y = lerp(sy, ty, k) - Math.sin(k * Math.PI) * 140;
    const ang0 = 0, ang1 = Math.atan2(d - b, c - a);
    const ang = lerp(ang0, ang1, k), half = CS / 2;
    drawTramo(x - Math.cos(ang) * half, y - Math.sin(ang) * half, x + Math.cos(ang) * half, y + Math.sin(ang) * half, .8 + .2 * k);
  }
  // sobrantes al galpón
  if (s.outcome !== 'falta' && (s.phase === 'close') && (s.extra || s.odd)) {
    const gxp = 356, gyp = 810;
    const items = Math.min(s.extra, 10);
    for (let i = 0; i < items; i++) {
      const lt = s.pt - .5 - i * .12;
      if (lt < 0 || lt > .8) continue;
      const k = easeInOut(lt / .8);
      const x = lerp(sx, gxp, k), y = lerp(sy, gyp, k) - Math.sin(k * Math.PI) * 220;
      const sc = 1 - .5 * k;
      const isSaco = s.odd && i === items - 1;
      if (isSaco) drawFit(IMG.saco_lana, x - 26 * sc, y - 26 * sc, 52 * sc, 52 * sc, .5, .5);
      else drawTramo(x - 34 * sc, y, x + 34 * sc, y, sc);
    }
  }
}

    ctx.beginPath(); ctx.arc(x + off, y + off + bob, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = COL.tinta; ctx.stroke();
    text(String(i + 1), x + off, y + off + bob + 4, 58, { bagel: true, color: open ? COL.tinta : '#8c8476' });
    text(LV[i].name, x, y + r + 34, 21, { w: 900, color: open ? COL.tinta : '#8c8476' });
    for (let k = 0; k < 3; k++) drawStar(x + (k - 1) * 36, y + r + 70, 34, k < G.stars[i]);
    if (!open) { // candado
      ctx.save(); ctx.translate(x + 40, y - 42);
      ctx.lineWidth = 4; ctx.strokeStyle = COL.tinta; ctx.beginPath(); ctx.arc(0, -6, 10, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = COL.oro; rr(-15, -6, 30, 24, 5); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  });
  text(`Estrellas: ${total} de 15`, 805, 640, 30, { bagel: true });
  button('volver', 470, 668, 220, 62, 'Título', { fill: COL.menta, onClick: () => { sfx.click(); screen = 'title'; } });
  if (allDone()) button('final', 920, 668, 230, 62, 'Ver final', { fill: COL.oro, onClick: () => { sfx.click(); showFinal(); } });
  G.mood = 'pensando';
  drawOvejita(t, 170, 880, 400);
  muteButton();
}

/* ================== Final ================== */
let finalT = 0;
function showFinal() { screen = 'final'; finalT = 0; G.mood = 'celebrando'; G.moodT = 0; G.particles = []; sfx.win(); starBurst(800, 300, 24); }
function drawFinal(t, dt) {
  finalT += dt;
  drawBg('fondo_mesa');
  const total = G.stars.reduce((a, b) => a + b, 0);
  text('Planificación completa', 805, 148, 52, { bagel: true, color: COL.crema, stroke: 11, shadow: 6 });
  drawStar(690, 222, 76, true, Math.sin(t * 2) * .08);
  text(`${total} de 15 estrellas`, 740, 226, 40, { bagel: true, align: 'left' });
  for (let i = 0; i < 5; i++) {
    const x = 490 + i * 157, y = 288;
    text(`Nivel ${i + 1}`, x, y, 17, { w: 900 });
    for (let k = 0; k < 3; k++) drawStar(x + (k - 1) * 28, y + 28, 26, k < G.stars[i]);
  }
  const msg = total === 15 ? 'Cada mancha rodeada con la lana justa.'
    : total >= 11 ? 'Todas las manchas quedaron rodeadas. Puedes ir por las 15 estrellas.'
    : 'Puedes volver a jugar para ajustar mejor la lana.';
  text(msg, 805, 356, 21, { w: 700, color: '#3c3c3c' });
  // bloque comercial
  ctx.strokeStyle = 'rgba(20,20,20,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(480, 386); ctx.lineTo(1130, 386); ctx.stroke();
  text('Lana patagónica de Aysén, lavada por mujeres rurales de la región.', 805, 418, 23, { w: 800 });
  text('¿Trabajas en el sector marítimo, portuario o acuícola?', 805, 470, 30, { w: 900, color: COL.petroleo });
  button('denuevo', 920, 516, 240, 76, 'Jugar de nuevo', { fill: COL.menta, size: 25, onClick: () => { sfx.click(); G.stars = [0, 0, 0, 0, 0]; saveStars(); startLevel(0); } });
  text('Juego ilustrativo. WoolBoom está en etapa de desarrollo y validación técnica.', 805, 640, 16, { w: 700, color: '#4a4a4a' });
  text('Cifras aproximadas del proceso.', 805, 663, 16, { w: 700, color: '#4a4a4a' });
  drawOvejita(t, 160, 880, 380);
  drawFit(IMG.mujeres_saludando, 1290, 330, 290, 290, .5, 1);
  corfoBadge(1220, 824);
  muteButton();
  drawParticles();
  if (Math.random() < dt * .6) starBurst(400 + Math.random() * 800, 180, 2);
}

function drawLoading() {
  ctx.fillStyle = COL.petroleo; ctx.fillRect(0, 0, W, H);
  const k = loadedCount / IMG_NAMES.length;
  text('Juntando el rebaño...', W / 2, H / 2 - 50, 44, { bagel: true, color: COL.crema });
  panel(W / 2 - 300, H / 2, 600, 40, COL.crema, 20, 5, 4);
  ctx.fillStyle = COL.menta; rr(W / 2 - 296, H / 2 + 4, 592 * k, 32, 16); ctx.fill();
}

/* ================== Bucle ================== */
let last = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  dt *= SPEED;
  T += dt;
  buttons = [];
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (screen === 'loading' && loadedCount >= IMG_NAMES.length && fontsReady) screen = 'title';
  // repetición al mantener
  if (pressed && pressed.repeat && ptr.down) {
    holdT += dt / SPEED;
    if (holdT > .4) { holdAcc += dt / SPEED; while (holdAcc > .085) { holdAcc -= .085; const b = buttons.find(q => q.id === pressed.id); const bb = lastButtons.find(q => q.id === pressed.id); const tgt = b || bb; if (tgt && !tgt.disabled && inside(tgt, ptr)) tgt.onClick(); } }
  }
  G.pop = Math.max(0, G.pop - dt * 5);
  G.shake = Math.max(0, G.shake - dt);
  G.moodT += dt;
  for (let i = 0; i < MAXS; i++) G.sheepT[i] += dt;
  if (screen === 'play' && G.phase === 'sim') updSim(dt);
  updParticles(dt);
  try {
    if (screen === 'loading') drawLoading();
    else if (screen === 'title') drawTitle(T);
    else if (screen === 'map') drawMap(T);
    else if (screen === 'play') drawPlay(T, dt);
    else if (screen === 'final') drawFinal(T, dt);
  } catch (err) { console.error(err); }
  // enlace "Conoce WoolBoom" (DOM)
  if (screen === 'final') {
    if (wb.style.display !== 'flex') { wb.style.display = 'flex'; wb.style.left = '460px'; wb.style.top = '516px'; wb.style.width = '430px'; wb.style.height = '76px'; }
  } else if (wb.style.display !== 'none') wb.style.display = 'none';
  lastButtons = buttons;
  requestAnimationFrame(frame);
}
let lastButtons = [];
requestAnimationFrame(frame);

/* ================== Depuración ================== */
window.__debug = {
  level(n) { startLevel((n | 0) - 1); return LV[G.level].name; },
  solve() {
    if (screen !== 'play') startLevel(G.level);
    const L = LV[G.level];
    resetPlan();
    if (L.modes) G.mode = L.optimal;
    G.count = L.geo.need[optimalKey(L)];
    startSim();
    return G.count;
  },
  answer() { const L = LV[G.level]; return L.geo.need[optimalKey(L)]; },
  needs() { return LV.map(L => ({ ...L.geo.need })); },
  set(n) { setCount(n); return G.count; },
  mode(m) { G.mode = m; },
  probar() { startSim(); },
  speed(k) { SPEED = k; },
  final() { showFinal(); },
  title() { screen = 'title'; },
  map() { screen = 'map'; },
  state() { return { screen, level: G.level + 1, count: G.count, mode: G.mode, phase: G.phase, sim: G.sim && { phase: G.sim.phase, outcome: G.sim.outcome, stars: G.sim.stars, needed: G.sim.needed, have: G.sim.have }, stars: G.stars.slice() }; }
};
})();
</script>
<script>/* Puente con la landing: dentro de la página de WoolBoom, los enlaces internos (#contacto) se abren en la página y no en el juego. */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||window.parent===window)return;e.preventDefault();try{window.parent.postMessage({woolboom:'ir',hash:a.getAttribute('href')},'*')}catch(_){}},true);</script>
